services:
  - type: web
    name: rekaz-alenjaz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m webapp.app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: "0.0.0.0"
      - key: USE_WAITRESS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
