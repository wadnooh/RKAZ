# مرحلة التجربة: خطة مجانية على Render
# بعد الاعتماد: غيّر plan إلى starter وأضف disk + RAKAZ_DATA_DIR=/var/data وTRIAL_MODE=0
services:
  - type: web
    name: rekaz-alenjaz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m webapp.app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: USE_WAITRESS
        value: "1"
      - key: TRIAL_MODE
        value: "1"
      - key: AUTO_BACKUP
        value: "1"
      - key: AUTO_BACKUP_HOURS
        value: "6"
      # عيّن BACKUP_SYNC_TOKEN في لوحة Render (Environment) ثم انسخه إلى الجهاز_الرئيسي/sync_config.json
      - key: PYTHON_VERSION
        value: "3.12.8"
      # لا تفعّل RAKAZ_DATA_DIR على المجاني بدون Disk.
      # عند الترقية للمدفوع أضف:
      # - key: TRIAL_MODE
      #   value: "0"
      # - key: RAKAZ_DATA_DIR
      #   value: "/var/data"
      # وDisk على المسار /var/data
