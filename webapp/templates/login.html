{% extends "base.html" %}
{% block content %}
<style>
  .login-page {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    min-height: 72vh;
    position: relative;
    z-index: 10;
  }
  .login-card {
    width: 100% !important;
    max-width: 480px !important;
    padding: 2.6rem 2.2rem !important;
    border-radius: 20px !important;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04) !important;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
  }
  .login-card .section-title {
    font-size: 1.7rem;
    margin: 0 0 1.6rem;
    text-align: center;
    color: #123f69;
    font-weight: 800;
  }
  .login-card .form { display: flex; flex-direction: column; gap: 1.1rem; }
  .login-card label {
    font-size: 1.02rem;
    margin-bottom: 0.35rem;
    font-weight: 700;
    color: #4a5568;
    display: block;
  }
  .login-card input[type="text"],
  .login-card input[type="password"] {
    width: 100%;
    padding: 0.95rem 1.15rem;
    font-size: 1.05rem;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    background: #f8fafc;
    font-family: inherit;
  }
  .login-card input:focus {
    border-color: #3182ce;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    outline: none;
  }
  .login-card .checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: #4a5568;
  }
  .login-card .btn {
    margin-top: 0.4rem;
    padding: 0.95rem;
    font-size: 1.15rem;
    border-radius: 12px;
    font-weight: 800;
    justify-content: center;
  }
  .login-hint {
    margin-top: 1rem;
    text-align: center;
    color: #5f748a;
    font-size: 0.88rem;
  }
</style>
<div class="page login-page">
  <div class="card login-card">
    <h2 class="section-title">{{ tr('login_subtitle') }}</h2>
    <form method="post" class="form">
      <div>
        <label>{{ tr('username') }}</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label>{{ tr('password') }}</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <label class="checkbox">
        <input type="checkbox" name="remember" value="1">
        {{ tr('remember_me') }}
      </label>
      <button class="btn primary" type="submit">{{ tr('login') }}</button>
      <a class="btn ghost" href="{{ url_for('forgot_password') }}">{{ tr('forgot_password') }}</a>
    </form>
  </div>
</div>
{% endblock %}
