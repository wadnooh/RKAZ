{# شريط فرعي داخل العمليات والصيانة — الأعطال محور العمل #}
<div class="toolbar" style="margin-bottom:12px;">
  <div class="actions" data-tab-strip="1" data-tab-strip-key="ops_rakaz_tabs">
    <a class="btn ghost{% if active=='ops' %} primary{% endif %}" href="{{ url_for('ops_home') }}">{{ _('لوحة العمليات') }}</a>
    {% if can('tickets.read') %}
    <a class="btn ghost{% if active=='tickets' %} primary{% endif %}" href="{{ url_for('tickets_list') }}">{{ _('الأعطال') }}</a>
    {% endif %}
    <a class="btn ghost{% if active=='primary_teams' %} primary{% endif %}" href="{{ url_for('ops_primary_teams') }}">{{ _('الفرق الأولية') }}</a>
    <a class="btn ghost{% if active=='teams' %} primary{% endif %}" href="{{ url_for('teams_page') }}">{{ _('فرق المهام العاجلة') }}</a>
    <a class="btn ghost{% if active=='issued_licenses' %} primary{% endif %}" href="{{ url_for('module_list', name='issued_licenses', linked_section='ops') }}">{{ _('الرخص المصدرة') }}</a>
  </div>
</div>
