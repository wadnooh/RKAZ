{% extends "base.html" %}
{% block content %}
<div class="toolbar" style="margin-bottom:12px;">
  <div class="actions">
    <a class="btn ghost" href="{{ url_for('users_home') }}">المستخدمون</a>
    <a class="btn primary" href="{{ url_for('settings_page') }}">إعدادات المكتب</a>
  </div>
</div>
<div class="card">
  <div class="toolbar">
    <div>
      <h2 class="section-title">الإعدادات</h2>
      <div class="meta">إعدادات المكتب ومؤشرات الأداء — ورقة Settings</div>
    </div>
  </div>
  <form method="post" class="form-grid">
    <div class="field"><label>اسم المكتب</label><input name="office_name" value="{{ s.office_name }}"></div>
    <div class="field full"><label>اسم الشركة</label><input name="company_name" value="{{ s.company_name }}"></div>
    <div class="field"><label>عدد الفرق</label><input type="number" name="teams_count" value="{{ s.teams_count }}"></div>
    <div class="field"><label>بلاغات يومية لكل فرقة</label><input type="number" name="daily_tickets" value="{{ s.daily_tickets }}"></div>
    <div class="field"><label>أيام العمل بالشهر</label><input type="number" name="work_days" value="{{ s.work_days }}"></div>
    <div class="field"><label>المصاريف الشهرية</label><input type="number" step="0.01" name="monthly_expenses" value="{{ s.monthly_expenses }}"></div>
    <div class="field"><label>تأخير أول تدفق مالي (شهور)</label><input type="number" name="cash_delay_months" value="{{ s.cash_delay_months }}"></div>
    <div class="field"><label>نسبة أعمال الطوارئ</label><input type="number" step="0.01" name="emergency_ratio" value="{{ s.emergency_ratio }}"></div>
    <div class="field"><label>متوسط البلاغ المستهدف</label><input type="number" step="0.01" name="target_avg" value="{{ s.target_avg }}"></div>
    <div class="field"><label>حد رفض البنود المسموح</label><input type="number" step="0.01" name="reject_limit" value="{{ s.reject_limit }}"></div>
    <div class="field"><label>زمن الاستجابة المستهدف (دقيقة)</label><input type="number" name="response_target" value="{{ s.response_target }}"></div>
    <div class="field"><label>زمن اعتماد المستخلص (أيام)</label><input type="number" name="invoice_days" value="{{ s.invoice_days }}"></div>
    <div class="actions" style="grid-column:1/-1">
      <button class="btn primary" type="submit">حفظ الإعدادات</button>
    </div>
  </form>
</div>
{% endblock %}
